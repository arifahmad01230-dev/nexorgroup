<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nexor Group | Management portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EA;--surface:#fff;--ink:#0E1B3D;--muted:#566079;--gold:#A87A1F;--gold-bright:#C9A24A;--line:#E4DCC8;--err:#B3261E;--ok:#1E7B4B;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--sans)}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:0;background:var(--gold-bright);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.line{background:transparent;border:1.5px solid var(--gold)}
.btn[disabled]{opacity:.6;cursor:wait}
.f{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
label.l{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
header{background:var(--ink);color:#F5EFE0}
.bar{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font:700 24px var(--serif);letter-spacing:.06em}
.brand small{display:block;font:600 10px var(--sans);letter-spacing:.32em;color:var(--gold-bright);margin-top:-4px}
.who{display:flex;align-items:center;gap:14px;font-size:14px;color:#C9D0E6}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.live i{width:9px;height:9px;border-radius:50%;background:#888;display:inline-block}
.live.on i{background:#3DDC84}
main{max-width:1280px;margin:0 auto;padding:24px}
#login{max-width:420px;margin:12vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
#login h1{font:600 36px var(--serif);margin:0 0 6px}
.err{color:var(--err);font-size:14px;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font:600 34px/1 var(--serif);color:var(--gold)}
.stat span{font-size:13px;color:var(--muted)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:14px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14.5px}
th{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#FBF9F3;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td small{color:var(--muted);display:block;font-size:12.5px}
.refbtn{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold-bright);text-underline-offset:3px;cursor:pointer}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:#EEE8D6;white-space:nowrap}
.pill.new_request{background:#FFF1C7}.pill.under_review,.pill.processing{background:#DCE6FF}.pill.more_info_required,.pill.awaiting_payment{background:#FFE0CC}
.pill.confirmed,.pill.completed,.pill.payment_received,.pill.paid{background:#D5F0E0}.pill.rejected,.pill.cancelled,.pill.refunded{background:#F7D6D3}
.empty{padding:40px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:22px;padding:0;width:min(760px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(14,27,61,.35)}
dialog::backdrop{background:rgba(14,27,61,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.dh h2{font:600 28px var(--serif);margin:0}
.db{padding:20px 24px 26px;overflow:auto;max-height:calc(92vh - 70px)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-bottom:18px}
.kv div span{display:block;font-size:12.5px;color:var(--muted)}
.box{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.box h3{font:600 22px var(--serif);margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 200px}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
ul.tl li small{display:block;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:80vw}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="login" hidden>
  <h1>Management portal</h1>
  <p style="color:var(--muted);margin:0 0 18px">Nexor Group staff only. Sign in with your work account.</p>
  <label class="l" for="em">Email</label><input class="f" id="em" type="email" autocomplete="username" style="margin-bottom:12px">
  <label class="l" for="pw">Password</label><input class="f" id="pw" type="password" autocomplete="current-password" style="margin-bottom:16px">
  <button class="btn" id="signin" type="button">Sign in</button>
  <p class="err" id="lerr" role="alert" hidden></p>
</section>

<div id="app" hidden>
  <header><div class="bar">
    <div class="brand">NEXOR<small>GROUP · MANAGEMENT</small></div>
    <div class="who"><span class="live" id="live"><i></i><span>Connecting</span></span><span id="me"></span><button class="btn line" id="out" type="button" style="color:#F5EFE0;padding:7px 14px">Sign out</button></div>
  </div></header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <input class="f" id="q" placeholder="Search customer name, email or reference" aria-label="Search">
      <select class="f" id="fs" aria-label="Status"></select>
      <select class="f" id="fv" aria-label="Service"></select>
      <select class="f" id="fd" aria-label="Destination"><option value="">All destinations</option><option>Egypt</option><option>Saudi Arabia</option></select>
      <button class="btn line" id="csv" type="button">Export CSV</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Reference</th><th>Customer</th><th>WhatsApp</th><th>Service</th><th>Destination</th><th>Preferred date</th><th>People</th><th>Submitted</th><th>Status</th><th>Payment</th></tr></thead>
      <tbody id="rows"></tbody>
    </table><div class="empty" id="empty" hidden>No bookings match.</div></div>
  </main>
</div>

<dialog id="dlg"><div class="dh"><h2 id="dt"></h2><button class="btn line" id="dx" type="button" style="padding:6px 14px">Close</button></div><div class="db" id="dbody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Public values only: the project URL and the public (anon) key. Staff access is enforced by sign-in plus row level security in the database.
var SUPABASE_URL = "https://ebwmfcioneqbuttdblmm.supabase.co";
var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVid21mY2lvbmVxYnV0dGRibG1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NjY3MjMsImV4cCI6MjExMDI0MjcyM30.Fr8hlkHJZOYkb-67Q9XGglLXpxKeXRcjuiRZDqNR5TQ";
var WA_NUMBER_NOTE = "Hello, this is Nexor Group about your booking ";

var STATUS = [["new_request","New Request"],["under_review","Under Review"],["more_info_required","More Information Required"],["awaiting_payment","Awaiting Payment"],["payment_received","Payment Received"],["processing","Processing"],["confirmed","Confirmed"],["completed","Completed"],["rejected","Rejected"],["cancelled","Cancelled"]];
var STAFF_ALLOWED = ["under_review","more_info_required","processing"];
var SERVICE = {travel:"Travel",admission:"Admission",hospital:"Hospital reservation",accommodation:"Accommodation"};
var PAY = {unpaid:"Unpaid",partially_paid:"Partially paid",paid:"Paid",refunded:"Refunded"};
var SL = {}; STATUS.forEach(function (s) { SL[s[0]] = s[1]; });

var sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
var S = { uid: null, profile: null, staff: {}, rows: [], open: null, ch: null, timer: null, poll: null };
var $ = function (id) { return document.getElementById(id); };
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function fmt(d, withTime) { if (!d) return "-"; var x = new Date(d); return isNaN(x) ? esc(d) : x.toLocaleString("en-GB", withTime ? { dateStyle: "medium", timeStyle: "short" } : { dateStyle: "medium" }); }
function isAdmin() { return S.profile && (S.profile.role === "admin" || S.profile.role === "super_admin"); }
function toast(m) { var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(function () { t.hidden = true; }, 5000); }

// ---------- Sign in and access control ----------
function showLogin(msg) { $("app").hidden = true; $("login").hidden = false; var e = $("lerr"); e.hidden = !msg; e.textContent = msg || ""; }
$("signin").onclick = function () {
  var b = $("signin"); b.disabled = true; $("lerr").hidden = true;
  sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value }).then(function (r) {
    if (r.error) showLogin("Sign-in failed. Check your email and password.");
  }).finally(function () { b.disabled = false; });
};
$("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("signin").click(); });
$("out").onclick = function () { sb.auth.signOut(); };

sb.auth.onAuthStateChange(function (ev, session) {
  if (!session) { teardown(); showLogin(); return; }
  if (S.uid === session.user.id) return;      // token refresh: nothing to redo
  S.uid = session.user.id;
  setTimeout(boot, 0);                         // do not call the database inside the auth callback
});

function boot() {
  sb.from("staff_profiles").select("id,full_name,role,is_active").eq("id", S.uid).maybeSingle().then(function (r) {
    if (r.error || !r.data || !r.data.is_active) {
      S.uid = null; sb.auth.signOut(); showLogin("This account is not authorised for the management portal."); return null;
    }
    S.profile = r.data;
    return sb.from("staff_profiles").select("id,full_name,role").eq("is_active", true).then(function (s) {
      (s.data || []).forEach(function (p) { S.staff[p.id] = p; });
      $("login").hidden = true; $("app").hidden = false;
      $("me").textContent = S.profile.full_name + " (" + S.profile.role.replace("_", " ") + ")";
      buildFilters(); refresh(); subscribe();
      clearInterval(S.poll); S.poll = setInterval(function () { if (!document.hidden) refresh(); }, 60000);
    });
  });
}
function teardown() { S.uid = null; S.profile = null; S.rows = []; clearInterval(S.poll); if (S.ch) { sb.removeChannel(S.ch); S.ch = null; } if ($("dlg").open) $("dlg").close(); }

// ---------- Data ----------
var SEL = "id,reference,service,destination,preferred_date,return_date,travellers,status,payment_status,created_at,details,additional_info,assigned_to,agency_fee,agreed_amount,currency,customers(full_name,email,whatsapp,nationality)";
function refresh() {
  return Promise.all([
    sb.from("bookings").select(SEL).is("archived_at", null).order("created_at", { ascending: false }).limit(1000),
    sb.rpc("booking_stats")
  ]).then(function (res) {
    if (res[0].error) { toast("Could not load bookings: " + res[0].error.message); return; }
    S.rows = res[0].data || [];
    renderStats(res[1].data || {}); renderRows();
    if (S.open && $("dlg").open) { var b = S.rows.filter(function (x) { return x.id === S.open; })[0]; if (b) renderDetail(b, true); }
  });
}
function queueRefresh() { clearTimeout(S.timer); S.timer = setTimeout(refresh, 400); }

function subscribe() {
  if (S.ch) sb.removeChannel(S.ch);
  S.ch = sb.channel("nexor-bookings").on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, function (p) {
    if (p.eventType === "INSERT" && p.new) toast("New booking " + p.new.reference);
    queueRefresh();
  }).subscribe(function (st) {
    var l = $("live"); var ok = st === "SUBSCRIBED";
    l.classList.toggle("on", ok); l.lastChild.textContent = ok ? "Live" : (st === "CLOSED" || st === "CHANNEL_ERROR" || st === "TIMED_OUT" ? "Reconnecting" : "Connecting");
  });
}

// ---------- Dashboard ----------
function renderStats(st) {
  var items = [["Total bookings", st.total || 0], ["New", st.new_request || 0], ["Under review", st.under_review || 0], ["Awaiting payment", st.awaiting_payment || 0], ["Confirmed", st.confirmed || 0], ["Cancelled", st.cancelled || 0]];
  $("stats").innerHTML = items.map(function (i) { return '<div class="stat"><b>' + esc(i[1]) + "</b><span>" + esc(i[0]) + "</span></div>"; }).join("");
}
function buildFilters() {
  if ($("fs").options.length) return;
  $("fs").innerHTML = '<option value="">All statuses</option>' + STATUS.map(function (s) { return '<option value="' + s[0] + '">' + esc(s[1]) + "</option>"; }).join("");
  $("fv").innerHTML = '<option value="">All services</option>' + Object.keys(SERVICE).map(function (k) { return '<option value="' + k + '">' + esc(SERVICE[k]) + "</option>"; }).join("");
}
["q", "fs", "fv", "fd"].forEach(function (id) { $(id).addEventListener("input", renderRows); });
function filtered() {
  var q = $("q").value.trim().toLowerCase(), fs = $("fs").value, fv = $("fv").value, fd = $("fd").value;
  return S.rows.filter(function (b) {
    var c = b.customers || {};
    if (fs && b.status !== fs) return false; if (fv && b.service !== fv) return false; if (fd && b.destination !== fd) return false;
    return !q || [b.reference, c.full_name, c.email].join(" ").toLowerCase().indexOf(q) > -1;
  });
}
function renderRows() {
  var rows = filtered();
  $("empty").hidden = rows.length > 0;
  $("rows").innerHTML = rows.map(function (b) {
    var c = b.customers || {};
    return "<tr><td><button class=\"refbtn\" data-id=\"" + esc(b.id) + "\">" + esc(b.reference) + "</button></td>" +
      "<td>" + esc(c.full_name) + "<small>" + esc(c.email) + "</small></td><td>" + esc(c.whatsapp) + "</td>" +
      "<td>" + esc(SERVICE[b.service] || b.service) + "</td><td>" + esc(b.destination) + "</td><td>" + fmt(b.preferred_date) + "</td>" +
      "<td>" + esc(b.travellers) + "</td><td>" + fmt(b.created_at, true) + "</td>" +
      '<td><span class="pill ' + esc(b.status) + '">' + esc(SL[b.status] || b.status) + "</span></td>" +
      '<td><span class="pill ' + esc(b.payment_status) + '">' + esc(PAY[b.payment_status] || b.payment_status) + "</span></td></tr>";
  }).join("");
}
$("rows").addEventListener("click", function (e) {
  var btn = e.target.closest(".refbtn"); if (!btn) return;
  var b = S.rows.filter(function (x) { return x.id === btn.dataset.id; })[0]; if (b) openDetail(b);
});
$("csv").onclick = function () {
  var head = ["Reference", "Customer", "Email", "WhatsApp", "Service", "Destination", "Preferred date", "People", "Submitted", "Status", "Payment"];
  function cell(v) { v = String(v == null ? "" : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
  var lines = [head.map(cell).join(",")].concat(filtered().map(function (b) { var c = b.customers || {};
    return [b.reference, c.full_name, c.email, c.whatsapp, SERVICE[b.service], b.destination, b.preferred_date, b.travellers, b.created_at, SL[b.status], PAY[b.payment_status]].map(cell).join(","); }));
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "nexor-bookings-" + new Date().toISOString().slice(0, 10) + ".csv"; a.click();
};

// ---------- Booking detail ----------
function openDetail(b) { S.open = b.id; renderDetail(b, false); $("dlg").showModal(); }
$("dx").onclick = function () { $("dlg").close(); S.open = null; };
$("dlg").addEventListener("close", function () { S.open = null; });

function renderDetail(b, keepForm) {
  var c = b.customers || {}, d = b.details || {};
  var detailRows = Object.keys(d).map(function (k) { return "<div><span>" + esc(k.replace(/_/g, " ")) + "</span>" + esc(d[k]) + "</div>"; }).join("");
  var allowed = STATUS.filter(function (s) { return isAdmin() || STAFF_ALLOWED.indexOf(s[0]) > -1 || s[0] === b.status; });
  var staffOpts = '<option value="">Unassigned</option>' + Object.keys(S.staff).map(function (id) { return '<option value="' + esc(id) + '"' + (b.assigned_to === id ? " selected" : "") + ">" + esc(S.staff[id].full_name) + "</option>"; }).join("");
  var wa = "https://wa.me/" + String(c.whatsapp || "").replace(/\D/g, "") + "?text=" + encodeURIComponent(WA_NUMBER_NOTE + b.reference + ".");
  var keep = keepForm ? { st: ($("nst") || {}).value, nt: ($("nnote") || {}).value } : {};
  $("dt").textContent = b.reference;
  $("dbody").innerHTML =
    '<div class="kv"><div><span>Customer</span>' + esc(c.full_name) + "</div><div><span>Nationality</span>" + esc(c.nationality || "-") + "</div>" +
    "<div><span>Email</span>" + esc(c.email) + "</div><div><span>WhatsApp</span>" + esc(c.whatsapp) + "</div>" +
    "<div><span>Service</span>" + esc(SERVICE[b.service] || b.service) + "</div><div><span>Destination</span>" + esc(b.destination) + "</div>" +
    "<div><span>Preferred date</span>" + fmt(b.preferred_date) + "</div><div><span>Return / check-out date</span>" + fmt(b.return_date) + "</div>" +
    "<div><span>Number of people</span>" + esc(b.travellers) + "</div><div><span>Submitted</span>" + fmt(b.created_at, true) + "</div>" +
    "<div><span>Booking status</span>" + esc(SL[b.status] || b.status) + "</div><div><span>Payment status</span>" + esc(PAY[b.payment_status] || b.payment_status) + "</div>" +
    detailRows + "</div>" +
    (b.additional_info ? "<div><span style=\"font-size:12.5px;color:var(--muted)\">Additional information</span><p style=\"margin:2px 0 0\">" + esc(b.additional_info) + "</p></div>" : "") +
    '<div class="row" style="margin-top:14px"><a class="btn line" target="_blank" rel="noopener" href="' + esc(wa) + '">Open WhatsApp</a><a class="btn line" href="mailto:' + esc(c.email) + "?subject=" + encodeURIComponent("Your Nexor Group booking " + b.reference) + '">Email customer</a></div>' +
    '<div class="box"><h3>Change status</h3><div class="row"><div><label class="l" for="nst">New status</label><select class="f" id="nst">' +
      allowed.map(function (s) { return '<option value="' + s[0] + '"' + (s[0] === b.status ? " selected" : "") + ">" + esc(s[1]) + "</option>"; }).join("") +
    '</select></div><div><label class="l" for="nnote">Note (optional)</label><input class="f" id="nnote" maxlength="500"></div><div style="flex:0 0 auto"><button class="btn" id="ssave" type="button">Save status</button></div></div><p class="err" id="serr" hidden></p></div>' +
    (isAdmin() ? '<div class="box"><h3>Assigned to</h3><div class="row"><select class="f" id="asg">' + staffOpts + '</select><div style="flex:0 0 auto"><button class="btn line" id="asave" type="button">Save assignment</button></div></div></div>' : "") +
    '<div class="box"><h3>Status history</h3><ul class="tl" id="hist"><li>Loading...</li></ul></div>' +
    '<div class="box"><h3>Internal notes</h3><ul class="tl" id="notes"><li>Loading...</li></ul><div class="row" style="margin-top:10px"><input class="f" id="newnote" maxlength="1000" placeholder="Add an internal note (never shown to the customer)"><div style="flex:0 0 auto"><button class="btn line" id="nadd" type="button">Add note</button></div></div></div>';
  if (keep.st) $("nst").value = keep.st; if (keep.nt) $("nnote").value = keep.nt;
  $("ssave").onclick = function () { saveStatus(b); };
  if ($("asave")) $("asave").onclick = function () { saveAssign(b); };
  $("nadd").onclick = function () { addNote(b); };
  loadHistory(b.id); loadNotes(b.id);
}
function who(id) { return id ? ((S.staff[id] && S.staff[id].full_name) || "Staff member") : "Customer / system"; }
function loadHistory(id) {
  sb.from("booking_status_history").select("from_status,to_status,created_at,note,changed_by").eq("booking_id", id).order("created_at", { ascending: true }).then(function (r) {
    var h = r.data || []; if (!$("hist")) return;
    $("hist").innerHTML = h.length ? h.map(function (x) { return "<li><b>" + esc(SL[x.to_status] || x.to_status) + "</b>" + (x.from_status ? " (from " + esc(SL[x.from_status]) + ")" : "") + "<small>" + fmt(x.created_at, true) + " · " + esc(who(x.changed_by)) + (x.note ? " · " + esc(x.note) : "") + "</small></li>"; }).join("") : "<li>No history yet.</li>";
  });
}
function loadNotes(id) {
  sb.from("internal_notes").select("body,created_at,author_id").eq("booking_id", id).order("created_at", { ascending: false }).then(function (r) {
    var n = r.data || []; if (!$("notes")) return;
    $("notes").innerHTML = n.length ? n.map(function (x) { return "<li>" + esc(x.body) + "<small>" + fmt(x.created_at, true) + " · " + esc(who(x.author_id)) + "</small></li>"; }).join("") : "<li>No notes yet.</li>";
  });
}
function saveStatus(b) {
  var btn = $("ssave"), e = $("serr"), next = $("nst").value; e.hidden = true;
  if (next === b.status && !$("nnote").value.trim()) { e.textContent = "That is already the current status."; e.hidden = false; return; }
  btn.disabled = true;
  sb.rpc("change_booking_status", { p_booking_id: b.id, p_status: next, p_note: $("nnote").value.trim() || null }).then(function (r) {
    if (r.error) { e.textContent = "Could not save: " + r.error.message; e.hidden = false; return; }
    toast("Status saved: " + (SL[next] || next)); $("nnote").value = ""; return refresh();
  }).finally(function () { btn.disabled = false; });
}
function saveAssign(b) {
  var v = $("asg").value || null;
  sb.from("bookings").update({ assigned_to: v }).eq("id", b.id).then(function (r) { if (r.error) toast("Could not assign: " + r.error.message); else { toast("Assignment saved"); refresh(); } });
}
function addNote(b) {
  var t = $("newnote").value.trim(); if (!t) return;
  sb.from("internal_notes").insert({ booking_id: b.id, author_id: S.uid, body: t }).then(function (r) {
    if (r.error) toast("Could not add note: " + r.error.message); else { $("newnote").value = ""; loadNotes(b.id); }
  });
}
</script>
</body>
</html>
